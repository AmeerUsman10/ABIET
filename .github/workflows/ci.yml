name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.store }} store)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", store: sqlite }
          - { python: "3.12", store: sqlite }
          - { python: "3.13", store: sqlite }
          - { python: "3.11", store: postgres }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: abiet_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ABIET_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ABIET_TEST_MYSQL_URL: mysql+pymysql://root:mysql@127.0.0.1:3306/abiet_it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install unixODBC (needed to load pyodbc)
        run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: pip install -r requirements-dev.txt
      - name: Use PostgreSQL for ABIET's internal store
        if: matrix.store == 'postgres'
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE abiet_test"
          echo "ABIET_TEST_DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/abiet_test" >> "$GITHUB_ENV"
      - run: pytest -ra

  e2e:
    name: End-to-end UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: pip install -r requirements.txt
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start a mock AI provider and ABIET
        run: |
          uvicorn --app-dir tests/e2e mock_openai:app --port 8765 > "$RUNNER_TEMP/mock.log" 2>&1 &
          DATA_DIR="$RUNNER_TEMP/abiet-data" OPENAI_API_KEY=mock OPENAI_BASE_URL=http://127.0.0.1:8765/v1 \
            uvicorn backend.main:app --port 8000 > "$RUNNER_TEMP/abiet.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/abiet.log"; exit 1
      - run: node tests/e2e/ui.test.cjs http://127.0.0.1:8000 "$RUNNER_TEMP"
      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            ${{ runner.temp }}/failed.png
            ${{ runner.temp }}/*.log

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t abiet:ci .
      - name: SQL Server ODBC driver is installed
        run: docker run --rm abiet:ci python -c "import pyodbc; d = pyodbc.drivers(); print(d); assert 'ODBC Driver 18 for SQL Server' in d"
      - name: Container starts and becomes healthy
        run: |
          docker run -d --name abiet -p 8000:8000 abiet:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/ | grep -q 'js/app.js'
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' abiet)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs abiet; exit 1
