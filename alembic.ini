# Alembic configuration for ABIET's internal database.
# The database URL comes from ABIET's settings (DATABASE_URL / DATA_DIR), not from this file.
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe the change"

[alembic]
script_location = backend/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
