# ABIET with PostgreSQL as its internal store.
#
#   cp .env.example .env      # add OPENAI_API_KEY (and ideally SECRET_KEY)
#   docker compose up -d --build
#   open http://localhost:8000
#
# Databases on your own machine (e.g. SQL Server Express) are reachable from the
# container as host.docker.internal.

services:
  abiet:
    build: .
    image: abiet:latest
    ports:
      - "${ABIET_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://abiet:${ABIET_DB_PASSWORD:-abiet}@db:5432/abiet
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    volumes:
      - abiet-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abiet
      POSTGRES_USER: abiet
      POSTGRES_PASSWORD: ${ABIET_DB_PASSWORD:-abiet}
    volumes:
      - abiet-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abiet -d abiet"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  abiet-data:
  abiet-db:
